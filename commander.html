<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commander en ligne — Burger Coffee Saly</title>
  <meta name="description" content="Commandez en ligne chez Burger Coffee Saly. Smashs, burgers, tacos, salades, café. Sur place, à emporter ou livraison gratuite sur tout Saly.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#123524">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/order.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
</head>
<body class="order-page">
  <a class="skip-link" href="#orderMain">Aller à la commande</a>

  <header class="header is-scrolled" id="header">
    <nav class="nav" aria-label="Navigation">
      <a href="index.html" class="nav__logo" aria-label="Burger Coffee Saly — Accueil">
        <span class="nav__logo-mark">BC</span>
        <span class="nav__logo-text">Burger Coffee Saly</span>
      </a>
      <div class="order-nav-meta">
        <span>Saly · Plein Sud 2</span>
        <span class="order-nav-meta__open">Ouvert 7h30 — 02h00</span>
      </div>
      <a href="index.html" class="nav__cta">Accueil</a>
    </nav>
  </header>

  <main id="orderMain" class="order-layout order-layout--wa">
    <aside class="order-cats" aria-label="Catégories">
      <button class="order-cat is-active" data-cat="all">Tout</button>
      <button class="order-cat" data-cat="burgers">🍔 Burgers</button>
      <button class="order-cat" data-cat="smashs">🍔 Smashs</button>
      <button class="order-cat" data-cat="menus">🔥 Menus</button>
      <button class="order-cat" data-cat="tacos">🌮 Tacos</button>
      <button class="order-cat" data-cat="salades">🥗 Salades</button>
      <button class="order-cat" data-cat="boissons">☕ Boissons</button>
      <button class="order-cat" data-cat="desserts">🍰 Desserts</button>
    </aside>

    <section class="order-menu">
      <div class="order-hero-banner">
        <div>
          <p class="eyebrow">Commander via WhatsApp</p>
          <h1>Burger Coffee Saly</h1>
          <p>Sur place · À emporter · Livraison gratuite sur tout Saly</p>
        </div>
        <div class="order-hero-banner__badge">Dès 2 500 F</div>
      </div>

      <div id="orderGrid" class="order-grid" aria-live="polite"></div>
    </section>
  </main>

  <dialog class="checkout-dialog menu-burger-dialog" id="menuBurgerDialog">
    <form method="dialog" class="checkout-form">
      <header>
        <h2>Menu Burger — 5 000 F</h2>
        <p>Choisissez obligatoirement votre burger ou smash.</p>
      </header>
      <div id="menuBurgerChoices" class="menu-choice-list" role="listbox" aria-label="Choix burger ou smash"></div>
      <div class="checkout-actions">
        <button type="button" class="btn btn--ghost-dark" id="menuBurgerCancel">Annuler</button>
      </div>
    </form>
  </dialog>

  <script src="js/order.js" defer></script>
</body>
</html>
