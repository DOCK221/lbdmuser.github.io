<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code — Burger Coffee Saly</title>
  <style>
    :root { --forest:#123524; --cream:#f7f3ea; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: Figtree, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1c4a35, var(--forest));
      color:#fff; text-align:center; padding:2rem;
    }
    .card {
      background: var(--cream); color: var(--forest);
      padding:2rem; border-radius:24px; max-width:420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { font-size:1.4rem; margin:0 0 .35rem; }
    p { margin:0 0 1.25rem; opacity:.8; font-size:.95rem; }
    img { width:min(280px,70vw); height:auto; background:#fff; border-radius:12px; }
    a { color: var(--forest); font-weight:700; word-break:break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Burger Coffee Saly</h1>
    <p>Scannez pour ouvrir le site</p>
    <img src="assets/qr/burger-coffee-saly-qr.png" alt="QR code Burger Coffee Saly">
    <p style="margin-top:1.25rem"><a href="https://ancient-shadow-5317.zerodeploy.app/">https://ancient-shadow-5317.zerodeploy.app/</a></p>
  </div>
</body>
</html>
